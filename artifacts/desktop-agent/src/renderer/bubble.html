<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nexet widget</title>
    <style>
      :root {
        /* Brand accent — red/orange, matches the agent window. */
        --accent: #e6150a;
        --accent-2: #ff5f4d;
        --accent-deep: #8f0c02;
      }
      * { box-sizing: border-box; margin: 0; user-select: none; }
      html, body { background: transparent; overflow: hidden; }
      body { width: 100vw; height: 100vh; }

      /* The whole circle is the drag handle (frameless window needs an
         -webkit-app-region: drag surface to be movable). */
      .bubble {
        -webkit-app-region: drag;
        position: absolute; inset: 0;
        display: grid; place-items: center;
        cursor: default;
      }

      /* The agent's app logo IS the bubble, shown whole — no frame or rounded
         clipping. Marked no-drag so a click opens the agent instead of
         starting a drag. */
      .core {
        -webkit-app-region: no-drag;
        position: relative; z-index: 2;
        width: 50px; height: 50px;
        object-fit: contain; display: block;
        cursor: pointer;
        transition: transform 0.14s ease, filter 0.14s ease;
      }
      .core:hover { transform: scale(1.06); filter: brightness(1.07); }
      .core:active { transform: scale(0.96); }

      /* Close affordance, revealed (and animated in) on hover. Small enough
         to sit on the rim of the compact orb without covering it. */
      .close {
        -webkit-app-region: no-drag;
        position: absolute; z-index: 3;
        top: 0; right: 0;
        width: 15px; height: 15px; border-radius: 50%;
        background: rgba(12, 12, 14, 0.85);
        color: #fff; cursor: pointer;
        display: grid; place-items: center;
        font: 600 8px/1 system-ui, sans-serif;
        border: 1px solid rgba(255, 255, 255, 0.5);
        opacity: 0; visibility: hidden; transform: scale(0.5);
        transition: opacity 0.16s ease, transform 0.16s ease, background 0.15s ease, visibility 0.16s;
      }
      .bubble:hover .close { opacity: 1; visibility: visible; transform: scale(1); }
      .close:hover {
        background: var(--accent);
        border-color: rgba(255, 255, 255, 0.7);
        box-shadow: 0 0 8px rgba(230, 21, 10, 0.6);
      }
    </style>
  </head>
  <body>
    <div class="bubble" id="bubble">
      <img class="core" id="core" src="./nexet-agent-logo.png" alt="" draggable="false" title="Open Nexet Desktop Agent" />
      <button class="close" id="close" title="Hide widget" aria-label="Hide widget">✕</button>
    </div>
    <script src="./bubble.js"></script>
  </body>
</html>
